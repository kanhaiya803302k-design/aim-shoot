<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AIM SHOT</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a16;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.game{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:#090d1d}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:14px;left:12px;right:12px;display:flex;gap:7px;z-index:5}.box{flex:1;padding:9px;text-align:center;color:white;background:#05081499;border:1px solid #ffffff20;border-radius:14px;backdrop-filter:blur(10px)}.box small{display:block;color:#9fa9c5;font-size:9px;letter-spacing:1px}.box strong{font-size:19px}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.card{width:100%;max-width:390px;padding:30px 22px;text-align:center;color:white;border-radius:27px;background:#050919d6;border:1px solid #ffffff24;backdrop-filter:blur(18px);box-shadow:0 25px 80px #00000073}.title{font-size:58px;font-weight:1000;letter-spacing:-5px}.subtitle{margin-top:8px;color:#9ea9c8;font-size:11px;letter-spacing:4px}.info{margin:22px 0;color:#c4cbdf;line-height:1.7}button{width:100%;border:0;border-radius:15px;padding:15px;margin-top:10px;font-size:15px;font-weight:900}.primary{background:linear-gradient(135deg,#8ff6ff,#9b82ff);color:#07101e}.secondary{background:#202943;color:white;border:1px solid #35405f}.hidden{display:none!important}.final{font-size:70px;font-weight:1000;letter-spacing:-5px;margin:10px 0}.best{margin:16px;color:#b9c2d9}.tip{position:absolute;bottom:18px;width:100%;text-align:center;color:#ffffff99;font-size:11px;z-index:5}#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;font-size:28px;font-weight:1000;color:white;text-shadow:0 0 20px #7df5ff;z-index:8;transition:.15s;white-space:nowrap}#message.show{opacity:1;transform:translate(-50%,-50%) scale(1)}</style></head><body><div class="game"><canvas id="canvas"></canvas><div class="hud hidden" id="hud"><div class="box"><small>SCORE</small><strong id="score">0</strong></div><div class="box"><small>TIME</small><strong id="time">30</strong></div><div class="box"><small>COMBO</small><strong id="combo">x1</strong></div></div><div class="screen" id="home"><div class="card"><div class="title">AIM</div><div class="subtitle">SHOT</div><div class="info">🎯 Tap the targets<br>🔥 Hit the center for bonus points<br>⚡ Targets get smaller<br>🏆 Build the biggest combo</div><button class="primary" onclick="startGame()">START SHOOTING</button><div class="best">BEST SCORE: <b id="homeBest">0</b></div></div></div><div class="screen hidden" id="gameOver"><div class="card"><h1>TIME'S UP!</h1><div class="final" id="finalScore">0</div><div>POINTS</div><div class="best">🏆 BEST: <b id="finalBest">0</b></div><button class="primary" onclick="startGame()">🔄 PLAY AGAIN</button><button class="secondary" onclick="shareScore()">📤 SHARE SCORE</button></div></div><div id="message"></div><div id="tip" class="tip hidden">TAP THE TARGET 🎯</div></div><script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");let W,H,running=false,animation,lastTime=0,score=0,combo=1,timeLeft=30,best=Number(localStorage.getItem("aimShotBest")||0),target=null,particles=[],shake=0,elapsed=0;
function resize(){W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W;canvas.height=H}addEventListener("resize",resize);resize();
function startGame(){running=true;score=0;combo=1;timeLeft=30;elapsed=0;target=null;particles=[];shake=0;home.classList.add("hidden");gameOver.classList.add("hidden");hud.classList.remove("hidden");tip.classList.remove("hidden");updateHUD();spawnTarget();lastTime=performance.now();cancelAnimationFrame(animation);animation=requestAnimationFrame(loop)}
function spawnTarget(){const d=Math.min(1,elapsed/30),r=Math.max(22,43-d*18),m=r+15;target={x:m+Math.random()*(W-m*2),y:105+r+Math.random()*Math.max(40,H-220-r*2),radius:r,angle:Math.random()*Math.PI*2}}
canvas.addEventListener("pointerdown",e=>{if(!running||!target)return;const q=canvas.getBoundingClientRect(),x=e.clientX-q.left,y=e.clientY-q.top,d=Math.hypot(x-target.x,y-target.y);if(d<=target.radius)hitTarget(d);else{combo=1;showMessage("MISS!")}})
function hitTarget(d){const r=d/target.radius;let p;if(r<.25){p=25*combo;showMessage("PERFECT! 🔥")}else if(r<.55){p=15*combo;showMessage("GREAT!")}else{p=10*combo;showMessage("+10")}score+=p;combo=Math.min(12,combo+1);shake=7;burst(target.x,target.y);target=null;setTimeout(()=>{if(running)spawnTarget()},90);updateHUD()}
function showMessage(t){const b=document.getElementById("message");b.textContent=t;b.classList.add("show");setTimeout(()=>b.classList.remove("show"),300)}
function burst(x,y){for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,p=2+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*p,vy:Math.sin(a)*p,life:1,size:2+Math.random()*4})}}
function loop(t){if(!running)return;const d=Math.min(50,t-lastTime);lastTime=t;elapsed+=d/1000;timeLeft=Math.max(0,30-elapsed);if(timeLeft<=0){endGame();return}update(d);draw();animation=requestAnimationFrame(loop)}
function update(d){if(target)target.angle+=d*.004;particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life-=d/550});particles=particles.filter(p=>p.life>0);if(shake>0)shake-=d*.05;updateHUD()}
function updateHUD(){document.getElementById("score").textContent=score;document.getElementById("time").textContent=Math.ceil(timeLeft);document.getElementById("combo").textContent="x"+combo}
function endGame(){if(!running)return;running=false;cancelAnimationFrame(animation);if(score>best){best=score;localStorage.setItem("aimShotBest",best)}document.getElementById("finalScore").textContent=score;document.getElementById("finalBest").textContent=best;document.getElementById("homeBest").textContent=best;hud.classList.add("hidden");tip.classList.add("hidden");gameOver.classList.remove("hidden")}
function draw(){ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#101b3d");g.addColorStop(.55,"#0c1430");g.addColorStop(1,"#050814");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle="#64beff14";for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=70;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<20;i++){const x=(i*91+elapsed*15)%W,y=i*137%H;ctx.fillStyle="#6ee6ff59";ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()}if(target){const r=target.radius;ctx.shadowBlur=30;ctx.shadowColor="#ff5f87";ctx.strokeStyle="#ff668c";ctx.lineWidth=5;ctx.beginPath();ctx.arc(target.x,target.y,r,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle="#12172b";ctx.beginPath();ctx.arc(target.x,target.y,r-4,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ff668c";ctx.lineWidth=3;ctx.beginPath();ctx.arc(target.x,target.y,r*.68,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(target.x,target.y,r*.36,0,Math.PI*2);ctx.stroke();ctx.fillStyle="#ff668c";ctx.beginPath();ctx.arc(target.x,target.y,r*.17,0,Math.PI*2);ctx.fill();const hx=target.x+Math.cos(target.angle)*r*.72,hy=target.y+Math.sin(target.angle)*r*.72;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(hx,hy,3,0,Math.PI*2);ctx.fill()}particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle="#8df5ff";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.restore()}
async function shareScore(){const text=`I scored ${score} in AIM SHOT 🎯🔥 Can you beat me?`;if(navigator.share){try{await navigator.share({title:"AIM SHOT",text,url:location.href})}catch(e){}}else{try{await navigator.clipboard.writeText(text+"\n"+location.href);alert("Score copied!")}catch(e){alert(text)}}}
document.getElementById("homeBest").textContent=best;
</script></body></html>
